[project]
name = "mio-transcription"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.135.1", "numpy==2.5.3", "uvicorn==0.42.0"]

[project.optional-dependencies]
inference = ["nemo_toolkit[asr]==3.0.0", "huggingface-hub==2.2.0"]
test = ["httpx==0.28.1", "pytest==9.0.3", "pyyaml==6.0.3"]

[tool.uv]
# NeMo 3.0.0 caps hydra-core at 1.3.2 and Lightning 2.4.0 caps fsspec below 2026, both
# with known vulnerabilities; hydra-core 1.3.7 and fsspec 2026.7.0 are the fixed releases. Lightning stays at NeMo's cap of 2.4.0: 2.6.6 breaks the
# import of NeMo's one-logger integration, and the open Lightning advisories concern
# load_from_checkpoint, which Mio never calls (it restores pinned .nemo checkpoints).
override-dependencies = ["hydra-core==1.3.7", "fsspec==2026.7.0"]

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mio_transcription*"]
