[project]
name = "mio-transcription"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.135.1", "numpy==2.5.3", "uvicorn==0.42.0"]

[project.optional-dependencies]
inference = ["nemo_toolkit[asr]==2.7.0", "huggingface-hub==0.36.2"]
test = ["httpx==0.28.1", "pytest==9.0.3", "pyyaml==6.0.3"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mio_transcription*"]
