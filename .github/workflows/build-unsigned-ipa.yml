name: Bygg Mio IPA

run-name: "Bygg Mio IPA #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mio-phase-two-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kompilera med Xcode 26
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Visa byggmiljön
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Kontrollera projektfiler
        run: |
          set -euo pipefail
          test -f MioPhaseTwo.xcodeproj/project.pbxproj
          test -f MioPhaseTwo/Info.plist
          test -f MioPhaseTwo/PrivacyInfo.xcprivacy
          test -f MioPhaseTwo/Models/MioContentModels.swift
          test -f MioPhaseTwo/Services/MioContentRepository.swift
          test -f MioPhaseTwo/PhaseTwoViews.swift
          plutil -lint MioPhaseTwo/Info.plist
          plutil -lint MioPhaseTwo/PrivacyInfo.xcprivacy

      - name: Bygg osignerad iPhone-app
        run: |
          set -euo pipefail
          xcodebuild \
            -project MioPhaseTwo.xcodeproj \
            -scheme MioPhaseTwo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Kompilera enhetstester
        run: |
          set -euo pipefail
          xcodebuild \
            -project MioPhaseTwo.xcodeproj \
            -scheme MioPhaseTwo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build-for-testing

      - name: Kör enhetstester
        run: |
          set -euo pipefail
          command -v jq
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json |
              jq -r '[
                .devices
                | to_entries[]
                | select(.key | contains(".iOS-26-"))
                | .value[]
                | select(.isAvailable == true and (.name | startswith("iPhone")))
              ][0].udid // empty'
          )"
          test -n "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          trap 'xcrun simctl shutdown "$SIMULATOR_UDID" || true' EXIT
          xcodebuild \
            -project MioPhaseTwo.xcodeproj \
            -scheme MioPhaseTwo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            test-without-building

      - name: Skapa IPA-filen
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MioPhaseTwo.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/MioPhaseTwo"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/MioPhaseTwo.app"

          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/MioPhaseTwo-unsigned.ipa" Payload
          )

          /usr/bin/unzip -t "$GITHUB_WORKSPACE/MioPhaseTwo-unsigned.ipa"
          /usr/bin/lipo -archs "$APP_PATH/MioPhaseTwo" | /usr/bin/grep -qw arm64

          {
            echo "Mio fas 2 – osignerad molnbyggnad"
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            sw_vers -productVersion | sed 's/^/macOS: /'
            xcodebuild -version | tr '\n' ' '
            echo
            xcrun --sdk iphoneos --show-sdk-version | sed 's/^/iPhoneOS SDK: /'
            /usr/bin/shasum -a 256 "$GITHUB_WORKSPACE/MioPhaseTwo-unsigned.ipa"
          } > "$GITHUB_WORKSPACE/MioPhaseTwo-buildinfo.txt"

      - name: Ladda upp färdig IPA
        uses: actions/upload-artifact@v7
        with:
          name: MioPhaseTwo-IPA
          path: |
            MioPhaseTwo-unsigned.ipa
            MioPhaseTwo-buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
