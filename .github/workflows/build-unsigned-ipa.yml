name: Bygg Mio IPA

run-name: "Bygg Mio IPA #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode 27 – bygg, test och IPA
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EXPECTED_IOS_MAJOR: "27"
      MINIMUM_IOS_VERSION: "26.0"

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Visa byggmiljön
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${XCODE_VERSION%%.*}" = "27"
          test "${IOS_SDK_VERSION%%.*}" = "$EXPECTED_IOS_MAJOR"

      - name: Kontrollera projektfiler
        run: |
          set -euo pipefail
          test -f Mio.xcodeproj/project.pbxproj
          test -f Mio/Info.plist
          test -f Mio/PrivacyInfo.xcprivacy
          test -f Mio/Models/MioContentModels.swift
          test -f Mio/Services/MioContentRepository.swift
          test -f Mio/ContentViews.swift
          plutil -lint Mio/Info.plist
          plutil -lint Mio/PrivacyInfo.xcprivacy
          plutil -lint MioWidgets/Info.plist

      - name: Diagnostisera strikt concurrency i det riktiga iOS-targetet
        # Diagnostic gate: warnings are recorded and uploaded, but do not block the IPA
        # until the existing warnings have been fixed (PLAN.md, Developer experience).
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/verify_concurrency.py" \
            --native --log "$RUNNER_TEMP/Mio-concurrency.log"

      - name: Bygg osignerad iPhone-app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Mio-release.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/Mio-release.log"

      - name: Kompilera enhetstester
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/Mio-test-build.log"

      - name: Kör enhetstester
        # Unit tests run alone on a fresh simulator, before any UI test can wedge it (run #33:
        # a hung UI test left the simulator unresponsive and a 2 s unit test then waited 10 min).
        # No spindump collection: for pure logic tests a hang means a wedged simulator, and
        # collecting diagnostics from one blocked for 600 s.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          command -v jq
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json |
              jq -r --argjson major "$EXPECTED_IOS_MAJOR" '[
                .devices
                | to_entries[]
                | .key as $runtime
                | select($runtime | test("\\.SimRuntime\\.iOS-[0-9-]+$"))
                | .value[]
                | select(.isAvailable == true and (.name | startswith("iPhone")))
                | {
                    version: (
                      $runtime
                      | capture("iOS-(?<version>[0-9-]+)$").version
                      | split("-")
                      | map(tonumber)
                    ),
                    udid: .udid
                  }
                | select(.version[0] == $major)
              ]
              | sort_by(.version)
              | reverse
              | .[0].udid // empty'
          )"
          if [[ -z "$SIMULATOR_UDID" ]]; then
            echo "::error::Ingen tillgänglig iPhone-simulator för iOS ${EXPECTED_IOS_MAJOR}.x hittades."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Vald simulator: $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          # simctl shutdown on a wedged simulator blocked for 9 min in run #33; perl's alarm bounds it.
          trap 'perl -e "alarm 60; exec @ARGV" xcrun simctl shutdown "$SIMULATOR_UDID" || true' EXIT
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Mio-tests.xcresult" \
            -only-testing:MioTests \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/Mio-tests.log"

      - name: Kör UI-tester
        # Separate step and result bundle so a simulator hang here cannot eat the unit tests or the
        # job limit. The iOS 27 simulator sometimes reports the app busy for 60 s after a tap and
        # then stalls (runs #31 and #33); one retry separates that from a real failure, and a retry
        # that passes is still recorded in the result bundle. Spindumps stay on for real UI hangs.
        if: ${{ !cancelled() && env.SIMULATOR_UDID != '' }}
        timeout-minutes: 16
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          trap 'perl -e "alarm 60; exec @ARGV" xcrun simctl shutdown "$SIMULATOR_UDID" || true' EXIT
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Mio-uitests.xcresult" \
            -only-testing:MioUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            test-without-building 2>&1 | tee "$RUNNER_TEMP/Mio-uitests.log"

      - name: Ta skärmbilder i simulatorn
        # Fresh simulator, no user data: Hem in light, dark and the largest text size, so the
        # design can be reviewed before installing. Never blocks the IPA; runs even after a test failure.
        if: ${{ !cancelled() && env.SIMULATOR_UDID != '' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/TestDerivedData/Build/Products/Debug-iphonesimulator/Mio.app"
          test -d "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          OUT="$RUNNER_TEMP/Mio-screenshots"
          mkdir -p "$OUT"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          trap 'perl -e "alarm 60; exec @ARGV" xcrun simctl shutdown "$SIMULATOR_UDID" || true' EXIT
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          shoot() {
            xcrun simctl ui "$SIMULATOR_UDID" appearance "$1"
            xcrun simctl ui "$SIMULATOR_UDID" content_size "$2"
            xcrun simctl terminate "$SIMULATOR_UDID" "$BUNDLE_ID" || true
            xcrun simctl launch "$SIMULATOR_UDID" "$BUNDLE_ID"
            sleep 8
            xcrun simctl io "$SIMULATOR_UDID" screenshot "$OUT/$3.png"
          }
          shoot light large hem-ljus
          shoot dark large hem-mork
          shoot light accessibility-extra-extra-extra-large hem-storsta-text
          shoot dark accessibility-extra-large hem-mork-stor-text
          ls -l "$OUT"

      - name: Ladda upp skärmbilder
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mio-screenshots
          path: ${{ runner.temp }}/Mio-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Visa testfel från resultatpaketet
        # Parallel xcodebuild output names failing tests without their assertion text.
        if: failure()
        run: |
          set -uo pipefail
          for bundle in Mio-tests Mio-uitests; do
          test -d "$RUNNER_TEMP/$bundle.xcresult" || { echo "Inget $bundle.xcresult skapades."; continue; }
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$bundle.xcresult" --compact \
            > "$RUNNER_TEMP/$bundle-summary.json" || continue
          python3 - "$RUNNER_TEMP/$bundle-summary.json" "$RUNNER_TEMP/$bundle.xcresult" <<'PY'
          import json, subprocess, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              test_id = failure.get('testIdentifierString') or failure.get('testName')
              print(f"::error::{test_id}: {failure.get('failureText')}")
              # The last recorded steps show where a hung or timed-out test was stuck.
              try:
                  raw = subprocess.run(["xcrun", "xcresulttool", "get", "test-results", "activities",
                                        "--test-id", test_id, "--path", sys.argv[2], "--compact"],
                                       capture_output=True, text=True, timeout=120, check=True).stdout
                  titles = []
                  def walk(node):
                      if isinstance(node, dict):
                          if isinstance(node.get("title"), str):
                              titles.append(node["title"])
                          for value in node.values():
                              walk(value)
                      elif isinstance(node, list):
                          for value in node:
                              walk(value)
                  walk(json.loads(raw))
                  print(f"::group::Sista steg i {test_id}")
                  print("\n".join(titles[-25:]) or "(inga steg registrerade)")
                  print("::endgroup::")
              except Exception as error:
                  print(f"Kunde inte läsa steg för {test_id}: {type(error).__name__}")
              # A hang leaves a spindump attachment; its main-thread stack names the blocking call.
              try:
                  import glob, os, re, tempfile
                  folder = tempfile.mkdtemp()
                  subprocess.run(["xcrun", "xcresulttool", "export", "attachments", "--path", sys.argv[2],
                                  "--output-path", folder, "--test-id", test_id],
                                 capture_output=True, text=True, timeout=300, check=True)
                  manifest = json.load(open(os.path.join(folder, "manifest.json")))
                  names = [a.get("exportedFileName") for entry in manifest for a in entry.get("attachments", [])
                           if "pindump" in (a.get("suggestedHumanReadableName") or a.get("exportedFileName") or "")]
                  for name in filter(None, names):
                      text = open(os.path.join(folder, name), errors="replace").read()
                      start = text.find("Process:  ") if "Process:  Mio" not in text else text.find("Process:  Mio")
                      section = text[start:] if start >= 0 else text
                      main = re.search(r"\n\s*Thread 0x[0-9a-f]+[^\n]*main-thread[^\n]*\n", section)
                      excerpt = section[main.start():] if main else section
                      print(f"::group::Huvudtråd i spindump för {test_id}")
                      print("\n".join(excerpt.splitlines()[:80]))
                      print("::endgroup::")
              except Exception as error:
                  print(f"Kunde inte läsa spindump för {test_id}: {type(error).__name__}")
          PY
          done

      - name: Skapa IPA-filen
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Mio.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/Mio"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "$MINIMUM_IOS_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "app.mio.assistant"
          # The Live Activity extension must ship inside the app; SideStore signs it as a second app ID.
          WIDGET_PATH="$APP_PATH/PlugIns/MioWidgets.appex"
          test -x "$WIDGET_PATH/MioWidgets"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_PATH/Info.plist")" = "app.mio.assistant.widgets"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET_PATH/Info.plist")" = "com.apple.widgetkit-extension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET_PATH/Info.plist")" = \
            "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/Mio.app"

          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/Mio-unsigned.ipa" Payload
          )

          /usr/bin/unzip -t "$GITHUB_WORKSPACE/Mio-unsigned.ipa"
          /usr/bin/lipo -archs "$APP_PATH/Mio" | /usr/bin/grep -qw arm64

          {
            echo "Mio – osignerad molnbyggnad"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | sed 's/^/Version: /'
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | sed 's/^/Build: /'
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" | sed 's/^/Minimum iOS: /'
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow: $GITHUB_WORKFLOW_REF"
            echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
            echo "Checkout dirty: $(git status --porcelain | wc -l | tr -d ' ')"
            sw_vers -productVersion | sed 's/^/macOS: /'
            xcodebuild -version | tr '\n' ' '
            echo
            xcrun --sdk iphoneos --show-sdk-version | sed 's/^/iPhoneOS SDK: /'
            /usr/bin/shasum -a 256 "$GITHUB_WORKSPACE/Mio-unsigned.ipa"
          } > "$GITHUB_WORKSPACE/Mio-buildinfo.txt"

      - name: Ladda upp färdig IPA
        uses: actions/upload-artifact@v7
        with:
          name: Mio-IPA
          path: |
            Mio-unsigned.ipa
            Mio-buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Skriv små skärmbilder i loggen
        # Artifact downloads can be unreachable from review sandboxes; small JPEGs in base64
        # between markers let a reviewer rebuild them from the job log. Simulator only, no user data.
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          for png in "$RUNNER_TEMP"/Mio-screenshots/*.png; do
            [ -f "$png" ] || continue
            name="$(basename "$png" .png)"
            sips -s format jpeg -s formatOptions 55 -Z 1000 "$png" --out "$RUNNER_TEMP/$name.jpg" >/dev/null
            echo "MIO-SHOT-BEGIN $name"
            base64 -i "$RUNNER_TEMP/$name.jpg" | fold -w 3000
            echo "MIO-SHOT-END $name"
          done

      - name: Spara native diagnostik även vid fel
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mio-native-verification
          path: |
            ${{ runner.temp }}/Mio-*.log
            ${{ runner.temp }}/Mio-*.xcresult
          if-no-files-found: warn
          retention-days: 14
