name: Bygg Mio IPA

run-name: "Bygg Mio IPA #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode 27 – bygg, test och IPA
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      EXPECTED_IOS_MAJOR: "27"
      MINIMUM_IOS_VERSION: "26.0"

    steps:
      - name: Hämta projektet
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Visa byggmiljön
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${XCODE_VERSION%%.*}" = "27"
          test "${IOS_SDK_VERSION%%.*}" = "$EXPECTED_IOS_MAJOR"

      - name: Kontrollera projektfiler
        run: |
          set -euo pipefail
          test -f Mio.xcodeproj/project.pbxproj
          test -f Mio/Info.plist
          test -f Mio/PrivacyInfo.xcprivacy
          test -f Mio/Models/MioContentModels.swift
          test -f Mio/Services/MioContentRepository.swift
          test -f Mio/ContentViews.swift
          plutil -lint Mio/Info.plist
          plutil -lint Mio/PrivacyInfo.xcprivacy

      - name: Bygg osignerad iPhone-app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Kompilera enhetstester
        run: |
          set -euo pipefail
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build-for-testing

      - name: Kör enhetstester
        run: |
          set -euo pipefail
          command -v jq
          SIMULATOR_UDID="$(
            xcrun simctl list devices available --json |
              jq -r --argjson major "$EXPECTED_IOS_MAJOR" '[
                .devices
                | to_entries[]
                | .key as $runtime
                | select($runtime | test("\\.SimRuntime\\.iOS-[0-9-]+$"))
                | .value[]
                | select(.isAvailable == true and (.name | startswith("iPhone")))
                | {
                    version: (
                      $runtime
                      | capture("iOS-(?<version>[0-9-]+)$").version
                      | split("-")
                      | map(tonumber)
                    ),
                    udid: .udid
                  }
                | select(.version[0] == $major)
              ]
              | sort_by(.version)
              | reverse
              | .[0].udid // empty'
          )"
          if [[ -z "$SIMULATOR_UDID" ]]; then
            echo "::error::Ingen tillgänglig iPhone-simulator för iOS ${EXPECTED_IOS_MAJOR}.x hittades."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Vald simulator: $SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          trap 'xcrun simctl shutdown "$SIMULATOR_UDID" || true' EXIT
          xcodebuild \
            -project Mio.xcodeproj \
            -scheme Mio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            test-without-building

      - name: Skapa IPA-filen
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Mio.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/Mio"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")" = "$MINIMUM_IOS_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "app.mio.assistant"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/Mio.app"

          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/Mio-unsigned.ipa" Payload
          )

          /usr/bin/unzip -t "$GITHUB_WORKSPACE/Mio-unsigned.ipa"
          /usr/bin/lipo -archs "$APP_PATH/Mio" | /usr/bin/grep -qw arm64

          {
            echo "Mio – osignerad molnbyggnad"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" | sed 's/^/Version: /'
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | sed 's/^/Build: /'
            /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" | sed 's/^/Minimum iOS: /'
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            sw_vers -productVersion | sed 's/^/macOS: /'
            xcodebuild -version | tr '\n' ' '
            echo
            xcrun --sdk iphoneos --show-sdk-version | sed 's/^/iPhoneOS SDK: /'
            /usr/bin/shasum -a 256 "$GITHUB_WORKSPACE/Mio-unsigned.ipa"
          } > "$GITHUB_WORKSPACE/Mio-buildinfo.txt"

      - name: Ladda upp färdig IPA
        uses: actions/upload-artifact@v7
        with:
          name: Mio-IPA
          path: |
            Mio-unsigned.ipa
            Mio-buildinfo.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
