name: Verifiera Mio på Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mio-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 20
    steps:
      - name: Installera Python för verifieraren
        # The Swift image has no python3; the verifier itself needs the system interpreter.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.22'
          enable-cache: false
      - name: Kör samma lokala verifiering
        run: python3 "$GITHUB_WORKSPACE/scripts/verify.py" --logs-dir "$GITHUB_WORKSPACE/.mio-verification"
      - name: Spara syntetiska kontrollresultat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mio-Linux-verification
          # Workspace-relative paths resolve identically inside the job container.
          path: |
            .mio-verification/*.log
            .mio-verification/verification.json
          if-no-files-found: warn
          retention-days: 14
