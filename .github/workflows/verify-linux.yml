name: Verifiera Mio på Linux

# No pull_request: the project works on main without branches or pull requests.
# The nightly run keeps the cache warm and catches toolchain or dependency drift.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 1 * * *'

permissions:
  contents: read

concurrency:
  # The event name keeps push, nightly and manual runs from cancelling each other.
  group: mio-linux-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    # The control panel compiles GPUI (gpui-kit); a cold cache needs most of this.
    timeout-minutes: 45
    steps:
      - name: Installera Python och byggverktyg för verifieraren
        # The Swift image has no python3 or curl; uv and the Pianissimo tests use the system
        # interpreter, rustup needs curl, and the gateway's TLS library compiles C code with gcc.
        # The rest is what gpui-kit lists for Ubuntu 24.04, for the control panel in control/.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates curl gcc libc6-dev \
            g++ cmake pkg-config libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libvulkan1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tillåt arbetskopian för git i containern
        # The checkout is owned by the runner user, the container runs as root;
        # the verifier records git provenance and must not hit dubious-ownership errors.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Installera Rust för gatewayen och verifieraren
        # Pinned to the toolchain the gateway was verified with; rustup checks the download.
        # Downloaded to a file first: a failed download must fail the step, not pipe nothing into sh.
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --component clippy --default-toolchain 1.100.0
          "$HOME/.cargo/bin/cargo" --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Återanvänd Rust-byggena
        # GPUI takes minutes to compile from scratch. rust-cache keeps the dependencies of all three
        # workspaces plus the cargo registry, drops the workspaces' own crates before saving, and keys
        # on the rustc version and the lockfiles. Only main saves, so one cache serves every run.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            tools -> target
            server -> target
            control -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.22'
          # Pianissimo's test dependencies come from the uv cache instead of PyPI on every run.
          enable-cache: true
          cache-dependency-glob: transcription-server/uv.lock
      - name: Kör samma lokala verifiering
        run: cargo run --locked --manifest-path "$GITHUB_WORKSPACE/tools/Cargo.toml" -- verify --logs-dir "$GITHUB_WORKSPACE/.mio-verification"
      - name: Spara syntetiska kontrollresultat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mio-Linux-verification
          # Workspace-relative paths resolve identically inside the job container.
          path: |
            .mio-verification/*.log
            .mio-verification/verification.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
