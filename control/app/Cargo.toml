[package]
name = "mio-control"
description = "Mio Kontroll: the tray app and window that run Mio on the PC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "mio_control"

[[bin]]
name = "mio-control"
path = "src/main.rs"

[dependencies]
mio-control-core.workspace = true
gpui-kit.workspace = true
# Tray via StatusNotifierItem (KDE's protocol); async-io instead of a tokio runtime.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# Hands tray clicks from ksni's thread to GPUI's foreground executor.
async-channel = "2.5.0"
# Desktop notifications when a service goes down; the version GPUI already builds.
notify-rust = "4.19.0"
serde_json = "1.0.154"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
